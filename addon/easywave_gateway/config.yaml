name: Easywave Gateway
version: "0.4.0"
slug: easywave_gateway
description: Passerelle RX discovery et TX one-shot Heltec SX1262 pour Easywave
arch:
  - aarch64
  - amd64
startup: application
init: false
uart: true
services:
  - mqtt:need
map:
  - type: share
    read_only: false
options:
  serial_port: /dev/ttyUSB0
  baud: 115200
  tx_enabled: false
  unknown_limit: 25
schema:
  serial_port: device
  baud: int(9600,921600)
  tx_enabled: bool
  unknown_limit: int(5,100)
